<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14361f">
<title>Banana Jungle</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#237a32;--bg2:#17531f;--ban:#ffd23f;--ban2:#c99700;--wood:#9a6330;--wood2:#6b3f1d;--edge:#2a170a;--ink:#fff4c9;--paper:#fff4c9;--txt:#3a2412;--red:#ff8a73;--ok:#b6f08a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14361f;--bg2:#0b2013}}
:root[data-theme="dark"]{--bg:#14361f;--bg2:#0b2013}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);background:linear-gradient(var(--bg),var(--bg2)) fixed;color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif}
h1,h2,h3,.btn,.chip b{font-family:"Lilita One",Impact,sans-serif;font-weight:400;letter-spacing:.3px}
main{max-width:560px;margin:0 auto;padding:12px 14px 40px}
.sign{position:relative;margin:8px 0 18px;padding:14px 16px;text-align:center;border:3px solid var(--edge);border-radius:12px;box-shadow:0 5px 0 var(--edge);background:repeating-linear-gradient(180deg,var(--wood) 0 30px,var(--wood2) 30px 33px)}
.sign h1{margin:0;font-size:30px;color:var(--ban);text-shadow:0 3px 0 var(--edge)}
.plank{position:relative;margin:0 0 14px;padding:14px;border:3px solid var(--edge);border-radius:10px;box-shadow:0 5px 0 var(--edge);background:repeating-linear-gradient(180deg,var(--wood) 0 38px,var(--wood2) 38px 41px);text-shadow:0 1px 0 var(--edge)}
.plank h2,.plank h3{margin:0 0 4px;font-size:22px}
.plank small,.muted{opacity:.85;font-size:14px}
button.plank{display:block;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.btn{display:block;width:100%;margin:0 0 12px;padding:13px 16px;font-size:20px;color:var(--txt);background:var(--ban);border:3px solid var(--edge);border-radius:12px;box-shadow:0 5px 0 var(--edge);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn.wood{color:var(--ink);background:var(--wood)}
.btn.sm{display:inline-block;width:auto;padding:6px 12px;font-size:16px;margin:0}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs .btn{margin:0;font-size:18px;padding:9px}
.tabs .btn:not(.on){background:var(--wood);color:var(--ink)}
input[type=text]{width:100%;padding:11px 12px;margin:4px 0 12px;font:800 16px Nunito,sans-serif;color:var(--txt);background:var(--paper);border:3px solid var(--edge);border-radius:10px}
select{width:100%;padding:11px;margin:4px 0 12px;font:800 16px Nunito,sans-serif;color:var(--txt);background:var(--paper);border:3px solid var(--edge);border-radius:10px}
label.f{display:block;font-weight:800}
:focus-visible{outline:3px solid var(--ban);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--paper);color:var(--txt);border:3px solid var(--edge);border-radius:999px;text-shadow:none;font-weight:800;cursor:pointer}
.chip input{width:20px;height:20px;accent-color:#2f8f3e}
.chip.x b{color:#b3261e}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:2px dashed rgba(255,244,201,.3)}
.row:last-child{border:0}
.pos{color:var(--ok)}.neg{color:var(--red)}
.err{margin:0 0 12px;padding:10px;background:#ffd9d2;color:#7a1a10;border:3px solid var(--edge);border-radius:10px}
.back{background:none;border:0;color:var(--ink);font:800 16px Nunito,sans-serif;padding:6px 0 12px;cursor:pointer}
.empty{text-align:center;padding:24px 10px}
.big{font-size:40px;line-height:1}
.prev{margin:0 0 14px;padding:10px;text-align:center;background:rgba(0,0,0,.28);border-radius:10px}
</style>
</head>
<body>
<main>
  <header class="sign"><h1>🌴 Banana Jungle 🍌</h1></header>
  <div id="app"></div>
</main>
<script>
const RATE=10, U=100, KEY='bananajungle.v1';
let S={groups:[]}, V={n:'home',gid:null,tab:'debts'}, D={name:'',mem:'',members:[],err:''};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.groups)S=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=u=>(u/U).toLocaleString('it-IT',{maximumFractionDigits:2});
const eur=u=>(u/U*RATE).toLocaleString('it-IT',{maximumFractionDigits:2});
const money=u=>`<b>${fmt(u)} 🍌</b> <small>(${eur(u)} €)</small>`;
const G=()=>S.groups.find(g=>g.id===V.gid);
const nm=(g,id)=>esc((g.members.find(m=>m.id===id)||{name:'?'}).name);

function split(t,ids){const n=ids.length,b=Math.floor(t/n),r=t-b*n;return ids.map((id,i)=>[id,b+(i<r?1:0)])}
function balances(g){const net={};g.members.forEach(m=>net[m.id]=0);
  g.baskets.forEach(b=>{net[b.payer]+=b.amount;split(b.amount,b.split).forEach(([id,s])=>net[id]-=s)});return net}
function settle(net){const c=[],d=[],out=[];
  for(const k in net){if(net[k]>0)c.push([k,net[k]]);else if(net[k]<0)d.push([k,-net[k]])}
  c.sort((a,b)=>b[1]-a[1]);d.sort((a,b)=>b[1]-a[1]);let i=0,j=0;
  while(i<c.length&&j<d.length){const m=Math.min(c[i][1],d[j][1]);out.push({from:d[j][0],to:c[i][0],u:m});
    c[i][1]-=m;d[j][1]-=m;if(!c[i][1])i++;if(!d[j][1])j++}
  return out}

function home(){
  const list=S.groups.map(g=>`<button class="plank" data-act="open" data-id="${g.id}"><h2>🛖 ${esc(g.name)}</h2>
    <small>${g.members.map(m=>esc(m.name)).join(', ')}</small><br><small>${g.baskets.length} cesti · ${fmt(g.baskets.reduce((a,b)=>a+b.amount,0))} 🍌 in totale</small></button>`).join('');
  return `<h2>Le tue giungle</h2>`+(list||`<div class="plank empty"><div class="big">🐒</div><p>Nessun gruppo ancora.<br>Crea una giungla e aggiungi gli amici.</p></div>`)
   +`<button class="btn" data-act="new">＋ Nuovo gruppo</button>`}

function create(){
  return `<button class="back" data-act="home">← Indietro</button><h2>Nuovo gruppo</h2>
  ${D.err?`<p class="err">${esc(D.err)}</p>`:''}
  <label class="f">Nome del gruppo<input type="text" id="gname" value="${esc(D.name)}" placeholder="Es. Vacanza al mare" maxlength="40"></label>
  <label class="f">Partecipanti<input type="text" id="mname" value="${esc(D.mem)}" placeholder="Scrivi un nome e premi Aggiungi" maxlength="24"></label>
  <button class="btn wood" data-act="addm">＋ Aggiungi partecipante</button>
  <div class="chips">${D.members.map((n,i)=>`<span class="chip x" data-act="rmm" data-i="${i}">${esc(n)} <b>✕</b></span>`).join('')}</div>
  <button class="btn" data-act="create">Crea gruppo</button>`}

function group(){const g=G();if(!g){V.n='home';return home()}
  const tabs=`<div class="tabs"><button class="btn ${V.tab==='debts'?'on':''}" data-act="tab" data-t="debts">Debiti</button><button class="btn ${V.tab==='baskets'?'on':''}" data-act="tab" data-t="baskets">Cesti</button></div>`;
  let body='';
  if(V.tab==='debts'){const net=balances(g),st=settle(net);
    body=`<div class="plank"><h3>Chi deve cosa</h3>`+(st.length?st.map(s=>`<div class="row"><span>${nm(g,s.from)} → ${nm(g,s.to)}</span><span>${money(s.u)}</span></div>`).join(''):`<p class="muted">Tutto in pari. Nessun debito!</p>`)+`</div>
    <div class="plank"><h3>Saldi</h3>`+g.members.map(m=>{const v=net[m.id];return `<div class="row"><span>${esc(m.name)}</span><span class="${v>0?'pos':v<0?'neg':''}">${v>0?'+':v<0?'−':''}${fmt(Math.abs(v))} 🍌</span></div>`}).join('')+`<p class="muted">+ = deve ricevere, − = deve pagare</p></div>`
  }else{
    body=g.baskets.length?[...g.baskets].reverse().map(b=>`<div class="plank"><div class="row"><h3>🍌 ${esc(b.desc)}</h3><button class="btn sm wood" data-act="rmb" data-id="${b.id}" aria-label="Elimina cesto">🗑</button></div>
      <div>${money(b.amount)}</div><small>Pagato da ${nm(g,b.payer)} · diviso tra ${b.split.map(i=>nm(g,i)).join(', ')} · ${new Date(b.date).toLocaleDateString('it-IT',{day:'numeric',month:'short'})}</small></div>`).join('')
      :`<div class="plank empty"><div class="big">🧺</div><p>Nessun cesto di banane.<br>Aggiungine uno per iniziare.</p></div>`}
  return `<button class="back" data-act="home">← Tutte le giungle</button><h2>🛖 ${esc(g.name)}</h2>
   <button class="btn" data-act="newb">🍌 Aggiungi cesto</button>${tabs}${body}
   <button class="btn wood" data-act="rmg">Elimina gruppo</button>`}

function basket(){const g=G();
  return `<button class="back" data-act="open" data-id="${g.id}">← Annulla</button><h2>Nuovo cesto di banane</h2>
  ${D.err?`<p class="err">${esc(D.err)}</p>`:''}
  <label class="f">Cosa avete preso?<input type="text" id="bdesc" placeholder="Es. Cena in pizzeria" maxlength="40"></label>
  <label class="f">Quante banane? (1 🍌 = ${RATE} €)<input type="text" id="bamt" inputmode="decimal" placeholder="Es. 2,5"></label>
  <label class="f">Chi ha pagato?<select id="bpayer">${g.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label>
  <div class="f">Dividi tra</div>
  <div class="chips">${g.members.map(m=>`<label class="chip"><input type="checkbox" class="bm" value="${m.id}" checked> ${esc(m.name)}</label>`).join('')}</div>
  <div class="prev" id="prev"></div>
  <button class="btn" data-act="saveb">Salva cesto</button>`}

function render(){$('#app').innerHTML=V.n==='home'?home():V.n==='create'?create():V.n==='basket'?basket():group();if(V.n==='basket')prev()}
function prev(){const a=parseAmt($('#bamt').value),n=document.querySelectorAll('.bm:checked').length;
  $('#prev').innerHTML=a>0&&n?`A testa: ${money(Math.round(a/n))}`:'Inserisci le banane e scegli chi partecipa'}
const parseAmt=v=>Math.round(parseFloat(String(v).replace(',','.'))*U)||0;

function addMember(){const n=D.mem.trim();if(!n)return;
  if(D.members.some(x=>x.toLowerCase()===n.toLowerCase())){D.err='Nome già inserito.';}else{D.members.push(n);D.err='';}
  D.mem='';render();const i=$('#mname');if(i)i.focus()}

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,g=G();
  if(a==='home'){V.n='home';V.gid=null}
  else if(a==='new'){D={name:'',mem:'',members:[],err:''};V.n='create'}
  else if(a==='addm'){addMember();return}
  else if(a==='rmm'){D.members.splice(+t.dataset.i,1)}
  else if(a==='create'){if(!D.name.trim())D.err='Dai un nome al gruppo.';
    else if(D.members.length<2)D.err='Servono almeno 2 partecipanti.';
    else{const ng={id:uid(),name:D.name.trim(),members:D.members.map(n=>({id:uid(),name:n})),baskets:[]};S.groups.push(ng);save();V={n:'group',gid:ng.id,tab:'debts'}}}
  else if(a==='open'){V={n:'group',gid:t.dataset.id,tab:'debts'}}
  else if(a==='tab'){V.tab=t.dataset.t}
  else if(a==='newb'){D.err='';V.n='basket'}
  else if(a==='saveb'){const amount=parseAmt($('#bamt').value),desc=$('#bdesc').value.trim(),ids=[...document.querySelectorAll('.bm:checked')].map(x=>x.value);
    if(!desc)D.err='Scrivi cosa avete preso.';else if(amount<=0)D.err='Inserisci un numero di banane maggiore di 0.';else if(!ids.length)D.err='Scegli almeno una persona.';
    else{g.baskets.push({id:uid(),desc,amount,payer:$('#bpayer').value,split:ids,date:new Date().toISOString()});save();D.err='';V.n='group';V.tab='debts'}}
  else if(a==='rmb'){if(confirm('Eliminare questo cesto?')){g.baskets=g.baskets.filter(b=>b.id!==t.dataset.id);save()}}
  else if(a==='rmg'){if(confirm('Eliminare il gruppo e tutti i suoi cesti?')){S.groups=S.groups.filter(x=>x.id!==g.id);save();V={n:'home',gid:null,tab:'debts'}}}
  render()});
document.addEventListener('input',e=>{if(e.target.id==='gname')D.name=e.target.value;if(e.target.id==='mname')D.mem=e.target.value;
  if(V.n==='basket')prev()});
document.addEventListener('change',e=>{if(V.n==='basket')prev()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='mname'){e.preventDefault();addMember()}});
render();
</script>
</body>
</html>
